metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.4.1
    lifecycle: experimental
min-vllm-version: "0.26.0"
ivllm-debug-level: 3
idle-timeout: 60

# vLLM config for MiniMax-M3 on Isambard AI
#
# Model: 427B total parameters, 26B active (MoE)
# MXFP8 quantization (also FP8-Dynamic) ~ 427B ~ 53Gb per GPU in theory
# In practice this is likely to need 4 nodes.

model: MiniMaxAI/MiniMax-M3-MXFP8

# Total number of attention head (64) must be divisible by number of nodes.
tensor-parallel-size: 8
enable-expert-parallel: true
distributed-backend-executor: ray

max-model-len: auto
gpu-memory-utilization: 0.95
max-num-seqs: 1
language-model-only: true

# MSA sparse attention: block-size=128 is MANDATORY
block-size: 128

# cannot be used on hopper
# attention_config.indexer_kv_dtype: fp8

# Chunked prefill for long context
enable-chunked-prefill: true

# Speculative decoding: EAGLE3 (3 tokens)
# speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":3}'

# Parsers (MiniMax-M3 custom)
enable-auto-tool-choice: true
tool-call-parser: minimax_m3
reasoning-parser: minimax_m3

# Prefix caching
enable-prefix-caching: true

# All flags that were needed in the past prior to ray. Keeping in case
# disable-custom-all-reduce: true
compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}}'
# kernel-config: '{"enable_flashinfer_autotune": false}'
# kv-offloading-size: 220

# Lazy loading for large models
safetensors-load-strategy: lazy

# debugging flags for crash
env:
    IVLLM_DISABLE_FLASHINFER: 1

