metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.3.0
    lifecycle: operational
min-vllm-version: "0.17.0"
idle-timeout: 60

# vLLM config for Qwen/Qwen3.5-397B-A17B-FP8 on Isambard AI
# Generated by ivllm generate-vllm-config
#
# Hardware: 4 × GH200 120GB per node (Isambard AI) - ~96 GiB usable HBM3e per GPU
# Model: 397B parameters (17B activated), ~397 GB at FP8 (1 byte/param)
# Architecture: MoE + Gated DeltaNet + Vision Encoder (multimodal)
#
# Parallelism: tp=4, pp=2 - requires 2 nodes (8 GPUs total)
#   8 × 86.4 GB usable = 691 GB; 397 GB weights leaves ~294 GB for KV cache
#
# Context: 262,144 tokens (full native context length)
#   With language-model-only, ~294 GB free for KV cache across 8 GPUs.
#   Reduce max-model-len if you encounter OOM at runtime.

model: Qwen/Qwen3.5-397B-A17B-FP8
trust-remote-code: true
tensor-parallel-size: 4
pipeline-parallel-size: 2
max-model-len: 262144
gpu-memory-utilization: 0.90
kv-cache-dtype: fp8
safetensors-load-strategy: eager

# Reasoning (thinking mode enabled by default; use /no_think in prompt to disable)
reasoning-parser: qwen3

# Tool calling
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder

# MoE efficiency (expert parallelism for MoE layers alongside tensor parallelism)
enable-expert-parallel: true

# Caching
enable-prefix-caching: true

# Using flashinfer allreduce backend: trtllm
# Worker failed with error 'Flashinfer allreduce is not supported for multi-node allreduce with 'trtllm' backend. Please use 'mnnvl' backend instead.'
# "flashinfer_nvlink_two_sided": Use flashinfer two-sided kernels for mnnvl
# all2all-backend: flashinfer_nvlink_two_sided
# disable-custom-all-reduce: true
# all2all-backend: deepep_v2
# moe-backend: deep_gemm
# env:
#     VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
# moe-backend: hpc

# Mixture of experts models need to be forced to use triton
gdn-prefill-backend: "triton"
moe-backend: triton             # Forces vLLM to use pre-compiled Triton MoE kernels
attention-config: '{"backend":"TRITON_ATTN"}'

# This will not have been picked up by vllm as it suppresses : false in the options
# enable-flashinfer-autotune: false  # Explicitly kills the profiling loop
# it appears to be working without

disable-custom-all-reduce: true

# disable-custom-all-reduce only disables vLLM's own custom quick-allreduce
# kernel — it does NOT stop the AllReduceFusionPass torch.compile pass from
# unconditionally trying to set up a FlashInfer allreduce workspace, which
# crashes multi-node jobs with:
#   ValueError: Flashinfer allreduce is not supported for multi-node
#   allreduce with 'trtllm' backend. Please use 'mnnvl' backend instead.
# (and 'mnnvl' itself doesn't work here — it needs real inter-node NVLink,
# which the Slingshot fabric doesn't provide). Disabling the fusion pass
# directly avoids the FlashInfer workspace setup entirely.
compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}}'

# N.B. vllm tells us to use mvnvl but this does not work on slingshot dso following this guidance is a bad idea.
# Instead we have to disable flashinfer-allreduce.
# Flags like VLLM_FLASHINFER_ALLREDUCE_BACKEND="none" don't actually exist.
# neither does VLLM_USE_FLASHINFER_MOE_FP8=0
# so in fact we use the disable-custom-all-reduce option

# Note: text-only mode - skips the vision encoder to free memory for extra KV cache.
# Remove this line to enable image/video input.
# language-model-only: true
