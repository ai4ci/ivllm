metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.4.1
    lifecycle: experimental
min-vllm-version: "0.19.1"
idle-timeout: 60

# vLLM config for Qwen/Qwen3-Coder-Next-FP8 on Isambard AI
#
# ⚠️ HARDWARE REQUIREMENTS:
# - 1 node × 2 GPUs = 2 GPUs total
# - ~70 GB model / 2 = 35 GB per GPU (fits in 70 GB!)
#
# Model: ~70B total parameters (estimated), expert-dominated
# Quantization: FP8
#   Total weight footprint: ~70 GB
#
# Parallelism: Wide EP (expert-dominated model)
#   TP=1 (no tensor parallel)
#   DP=2 (data parallel across 2 GPUs)
#   EP=2 (experts distributed)
#
# KV Cache: Full 262K context fits on-GPU

model: Qwen/Qwen3-Coder-Next-FP8

# Wide EP: TP=1, DP=2, EP=2
tensor-parallel-size: 1
data-parallel-size: 2
enable-expert-parallel: true

# MoE backend: triton (stable)
moe-backend: triton

# All2All backend: allgather_reducescatter (stable)
all2all-backend: allgather_reducescatter

# KV cache: FP8
kv-cache-dtype: fp8

# Context: Full 262K native context
max-model-len: 262144

# Memory tuning (70 GB usable per GPU)
# 35 GB weights + 35 GB KV cache headroom
gpu-memory-utilization: 0.95
max-num-seqs: 256
max-num-batched-tokens: 16384

# Chunked prefill
enable-chunked-prefill: true

# Parsers (Qwen custom)
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: qwen3

# Prefix caching
enable-prefix-caching: true

# Disable FlashInfer autotune
attention-backend: TRITON_ATTN
enable-flashinfer-autotune: false
gdn-prefill-backend: triton