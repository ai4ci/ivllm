metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.1.0
    lifecycle: failing
min-vllm-version: "0.23.0"
idle-timeout: 60

# NOT WORKING
#
# vLLM config for deepseek-ai/DeepSeek-V4-Pro on Isambard AI
#
# Hardware: 4 × GH200 120GB per node (Isambard AI Phase 1/2) — ~96 GiB usable HBM3e per GPU
# Model: 1.6T total parameters, 49B active parameters (MoE)
# Total weigt ~ 960Gb of which
# 384 experts (16x24)
#
# Uses Tensor + Data + Expert Parallel (TEP) with expert layers split via EP.
#
# Quantization: Native FP4+FP8 mixed checkpoint (experts are in FP4, dense layers in FP8)
#   which reduces model weights footprint to ~960 GB - 140GB shared layers - split 4 ways within node ~ 35Gb. 820G experts split 16 ways
# may need to up to 6 nodes (24 GPUs)
#
# Architecture: Mixture of Experts (MoE) with hybrid CSA+HCA attention
#   Compressed Sparse Attention (CSA) and Heavily Compressed Attention (HCA)
#   reduce the KV cache footprint to just 10% of V3.2.
#   Three-tier reasoning effort: Non-think, Think High, and Think Max.
#   Function calling: native deepseek_v4 tool-use protocol.

model: deepseek-ai/DeepSeek-V4-Pro-DSpark

# 384 experts so 16x24 (either 16 nodes or 24 nodes)
tensor-parallel-size: 4
data-parallel-size: 6
enable-expert-parallel: true

# Weights occupy ~960 GB. 16 GPUs offer 1920 GB VRAM (50 GB weights/GPU with TP=16 or TP=4+DP=4).


kv-cache-dtype: fp8
block-size: 256
# in GiB. When TP > 1, this is the total buffer size summed across all TP ranks (This is 64G per node I think as data parallel?)
kv-offloading-size: 256
kv-offloading-backend: native

# High context capability up to 1,000,000 tokens (recipe recommends 800K max-model-len)
# Reduced to 512K to reduce scheduler edge-case triggers for upstream bug #41530
# max-model-len: 524288
max-model-len: 1048576
gpu-memory-utilization: 0.85
# Max batch parameters to protect host/GPU RAM
max-num-seqs: 64
max-num-batched-tokens: 16384

# Compilation and decoding optimizations
# enforce-eager: disables CUDA graphs to avoid replay hangs (upstream bug #41530)
compilation-config: '{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY", "pass_config": {"fuse_allreduce_rms": false}, "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64]}'

# speculative-config: '{"method": "deepseek_mtp","num_speculative_tokens": 1}'
speculative-config: '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'

# enable-flashinfer-autotune: false

trust-remote-code: true

# Thinking / reasoning — exposes explicit step-by-step reasoning
reasoning-parser: deepseek_v4

# Tool calling — DeepSeek V4 uses a custom protocol;
# the deepseek_v4 parser handles serialisation into tool_calls objects.
enable-auto-tool-choice: true
tool-call-parser: deepseek_v4
tokenizer-mode: deepseek_v4

# Prefix caching — disabled to avoid scheduler deadlock (upstream vLLM #41530)
# enable-prefix-caching: true

moe-backend: humming
all2all-backend: deepep_low_latency
# Patched Isambard AI humming version dequantises fp4 experts to fp8
# see env variables for humming settings.

# Environment variables required for Hopper GPUs (per vLLM recipe).
# Stripped before passing to vLLM serve; rendered as export lines in the SLURM script.
env:
  VLLM_ENGINE_READY_TIMEOUT: "3600"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_HUMMING_MOE_GEMM_TYPE: indexed
  VLLM_HUMMING_INPUT_QUANT_CONFIG: '{"dtype":"float8e4m3","input_scale_group_size":128}'

