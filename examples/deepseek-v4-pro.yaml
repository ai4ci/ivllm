metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.4.2
    lifecycle: failing
min-vllm-version: "0.23.0"
idle-timeout: 60

# ⚠️ WARNING: THIS CONFIG IS NOT VIABLE ON ISAMBARD AI
#
# DeepSeek-V4-Pro requires MINIMUM 16 nodes (64 GPUs) to run.
# This config is kept for reference only - DO NOT USE.
#
# REASON: Shared layers (~250 GB fp8) must be sharded by TP.
# With TP=1 (Wide EP), shared layers replicate on EVERY GPU.
# 250 GB > 70 GB usable per GPU = IMMEDIATE OOM.
#
# MINIMUM VIABLE CONFIGURATION:
# - TP=8 (shard shared layers to ~31 GB/GPU)
# - EP=64 (distribute experts to ~20 GB/GPU)
# - DP=1 (or more for throughput)
# - Total: 64 GPUs = 16 nodes × 4 GPUs/node
#
# ALTERNATIVE: Use DeepSeek-V4-Flash instead
# - Already has operational config (examples/deepseek-v4-flash.yaml)
# - Fits on 4 nodes (16 GPUs)
# - ~95% of Pro capability at 40% the size

model: deepseek-ai/DeepSeek-V4-Pro-DSpark

# ❌ THIS CONFIG DOESN'T WORK - SHARED LAYERS WON'T FIT
# tensor-parallel-size: 1
# data-parallel-size: 4
# enable-expert-parallel: true

# ✅ MINIMUM VIABLE (requires 16 nodes!):
tensor-parallel-size: 8
data-parallel-size: 8
enable-expert-parallel: true

# MoE backend: humming for W4A8 (FP4×FP8)
moe-backend: humming

# All2All backend: deepep_low_latency
all2all-backend: deepep_low_latency

# KV cache: FP8
kv-cache-dtype: fp8_e4m3
block-size: 256

# Context: 128K (limited by massive model size)
max-model-len: 131072

# Memory tuning
gpu-memory-utilization: 0.85
max-num-seqs: 16
max-num-batched-tokens: 4096

# KV Offloading: UVA (Unified Virtual Addressing) for GH200
# Uses NVLink-C2C (900 GB/s) for zero-copy access
# See: design/gh200-kv-offloading-research.md
cpu-offload-gb: 128
offload-backend: uva

# Speculative decoding: DSpark (7 tokens)
speculative-config: '{"method":"dspark","num_speculative_tokens":7}'

# Trust remote code
trust-remote-code: true

# Parsers
reasoning-parser: deepseek_v4
enable-auto-tool-choice: true
tool-call-parser: deepseek_v4
tokenizer-mode: deepseek_v4

# humming env vars
env:
  VLLM_ENGINE_READY_TIMEOUT: "3600"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_HUMMING_MOE_GEMM_TYPE: indexed
  VLLM_HUMMING_INPUT_QUANT_CONFIG: '{"dtype":"float8e4m3","input_scale_group_size":128}'

# Disable FlashInfer autotune
attention-backend: TRITON_ATTN
enable-flashinfer-autotune: false
gdn-prefill-backend: triton