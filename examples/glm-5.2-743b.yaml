metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.1.0
    lifecycle: experimental

# Recipe source: https://recipes.vllm.ai/zai-org/GLM-5.2
# Model card: https://huggingface.co/zai-org/GLM-5.2

model: zai-org/GLM-5.2-FP8

tensor-parallel-size: 4
data-parallel-size: 4
enable-expert-parallel: true

max-model-len: 1048576
kv-offloading-size: 256
kv-offloading-backend: native

gpu-memory-utilization: 0.80
enable-chunked-prefill: true
max-num-seqs: 64
max-num-batched-tokens: 16384

kv-cache-dtype: fp8
enable-auto-tool-choice: true
tool-call-parser: glm47
reasoning-parser: glm45

safetensors-load-strategy: lazy

speculative-config: '{"method": "mtp", "num_speculative_tokens": 1}'
compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}, "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64]}'
enable-prefix-caching: true
min-vllm-version: "0.23.0"

moe-backend: deep_gemm
all2all-backend: deepep_low_latency

