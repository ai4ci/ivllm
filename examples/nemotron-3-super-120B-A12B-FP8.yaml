metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.3.0
    lifecycle: operational
min-vllm-version: "0.22.0"
idle-timeout: 60

model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
tensor-parallel-size: 4

max-model-len: 1048576
gpu-memory-utilization: 0.95
kv-cache-dtype: fp8

enable-auto-tool-choice: true
tool-call-parser: qwen3_coder

reasoning-parser: nemotron_v3

enable-prefix-caching: true

enable-chunked-prefill: true
max-num-seqs: 512

# Mixture of experts models need to be forced to use triton
# gdn-prefill-backend: "triton"
# moe-backend: triton             # Forces vLLM to use pre-compiled Triton MoE kernels
# attention-config: '{"backend":"TRITON_ATTN"}'
# This will not have been picked up by vllm as it suppresses : false in the options
# enable-flashinfer-autotune: false  # Explicitly kills the profiling loop
# it appears to be working without

# suggested on the huggingface card (but not vllm recipes)
async-scheduling: true
trust-remote-code: true
max-cudagraph-capture-size: 128
mamba-ssm-cache-dtype: float32
