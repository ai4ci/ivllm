metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.4.1
    lifecycle: experimental
min-vllm-version: "0.22.0"
idle-timeout: 60

# vLLM config for NVIDIA-Nemotron-3-Ultra-550B-A55B-FP8 on Isambard AI
#
# ⚠️ HARDWARE REQUIREMENTS:
# - 2 nodes × 4 GPUs = 8 GPUs total
# - 550 GB model / 8 = 68.75 GB per GPU (tight fit in 70 GB usable!)
#
# Model: 550B total parameters, 55B active (MoE)
# Architecture: Hybrid Transformer-Mamba (LatentMoE)
# Quantization: FP8 block-quantized
#   Total weight footprint: ~550 GB
#
# Parallelism: Hybrid EP across 2 nodes
#   TP=4 (within each node - shards attention and Mamba layers)
#   DP=2 (data parallel across 2 nodes)
#   EP=8 (experts distributed across all 8 GPUs)
#
# KV Cache Offloading: RECOMMENDED
#   Tight VRAM fit (68.75 GB leaves only ~1.25 GB for KV)
#   Mooncake enables practical context lengths

model: RedHatAI/NVIDIA-Nemotron-3-Ultra-550B-A55B-FP8-dynamic

# Hybrid EP: TP=4, DP=2, EP=8 (2 nodes × 4 GPUs)
tensor-parallel-size: 8
# data-parallel-size: 2
enable-expert-parallel: true

distributed-backend-executor: ray
disable-custom-all-reduce: true

# KV cache: FP8
kv-cache-dtype: fp8_e4m3

# Context: 384K on-GPU (tight VRAM fit)
max-model-len: 1048576

# kv-cache-memory-bytes: 10G

# Size of the KV cache offloading buffer in GiB. When TP > 1, this is the total buffer size summed across all TP ranks. By default, this is set to None, which means no KV offloading is enabled. When set, vLLM will enable KV cache offloading to CPU using the kv\_offloading\_backend.
# kv-offloading-size: 200
# kv-offloading-backend: native

# Memory tuning (70 GB usable per GPU - TIGHT FIT)
# 68.75 GB weights + 1.25 GB KV cache (minimal!)
gpu-memory-utilization: 0.95
max-num-seqs: 8
max-num-batched-tokens: 4096

# Chunked prefill for long context
enable-chunked-prefill: true

# Parsers (Nemotron custom)
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: nemotron_v3

# Prefix caching
enable-prefix-caching: true

# Async scheduling for Mamba layers
async-scheduling: true

# Trust remote code
trust-remote-code: true

moe-backend: marlin

# Mamba backend: flashinfer for Mamba SSM layers
mamba-backend: flashinfer
mamba-ssm-cache-dtype: float16
enable-mamba-cache-stochastic-rounding: true
mamba-cache-philox-rounds: 5

# Speculative decoding: Nemotron H-MTP (5 tokens)
speculative-config: '{"method": "nemotron_h_mtp", "num_speculative_tokens": 5}'

# Compilation fix
compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}, "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64]}'

# Disable FlashInfer autotune (2+ hour startup on MoE)
# attention-backend: TRITON_ATTN
# enable-flashinfer-autotune: false
# gdn-prefill-backend: triton

env:
    IVLLM_DEBUG_LEVEL: 3
    IVLLM_RUNTIME_DEBUG: 1
