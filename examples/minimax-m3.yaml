# NOT WORKING


# Hardware: NVIDIA GH200 (Grace Hopper) — 4×120GB per node, ~96 GiB usable per GPU
# FP8 weights: ~743 GB total → ~62 GB/GPU (fp8) → fits on 9+ GPUs at 96 GiB
# FP8 KV cache: extra ~33 GB/node for KV cache at full 1M context
#
# Multi-node: tp=4 per node (full 4-GPU node), pp=3 stages = 3 nodes
#
# Recipe source: https://recipes.vllm.ai/zai-org/GLM-5.2
# Model card: https://huggingface.co/zai-org/GLM-5.2

model: EmbeddedLLM/MiniMax-M3-FP8-dynamic
# model: MiniMaxAI/MiniMax-M3-MXFP8
# tensor-parallel-size: 1
# data-parallel-size: 16
# data-parallel-size-local: 4
tensor-parallel-size: 4
data-parallel-size: 4
enable-expert-parallel: true
block-size: 128

max-model-len: 1048576
max-cudagraph-capture-size: 16
# kv-offloading-size: 1600              # 100 GiB per GPU * 16 total active ranks
# kv-offloading-backend: native         # Activates vLLM's asynchronous offload loop
# disable-hybrid-kv-cache-manager: true # Mandatory flag to bypass HMA mapping errors
# env:
#     VLLM_CPU_KVCACHE_SPACE: 1600
#     VLLM_USE_SIMPLE_KV_OFFLOAD: 1


# all2all-backend: deepep_low_latency
env:
    VLLM_ALLREDUCE_USE_FLASHINFER: 0
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
    VLLM_MARLIN_USE_ATOMIC_ADD: 1



gpu-memory-utilization: 0.90
enable-chunked-prefill: true
max-num-batched-tokens: 4096

kv-cache-dtype: fp8

tool-call-parser: minimax_m3
reasoning-parser: minimax_m3
enable-auto-tool-choice: true

safetensors-load-strategy: lazy
# cpu-offload-gb: 80

compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}}'
enable-prefix-caching: true
min-vllm-version: "0.24.0"

enable-flashinfer-autotune: false
gdn-prefill-backend: "triton"
moe-backend: triton
attention-config: '{"backend":"TRITON_ATTN"}'

# Need to make it available offline
# speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'

