metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.3.0
    lifecycle: operational
min-vllm-version: "0.30.0"
idle-timeout: 60

# vLLM config for zai-org/GLM-5.3-Flash on Isambard AI
#
# - 320 GB model
# GLM-5.3-Flash is a 320B-total / 18B-active multimodal MoE
# hybrid KDA and sparse MLA attention,
# native FP8 weights, MTP, and a 1M-token context window.
#
# Quantization: FP8 (1 byte/param)

model: zai-org/GLM-5.3-Flash

# Total number of attention head (64) must be divisible by number of nodes.
tensor-parallel-size: 8
distributed-backend-executor: ray
enable-expert-parallel: true
no-enable-flashinfer-autotune: true

# enforce-eager: true
# compilation-config: '{"cudagraph_mode": "PIECEWISE"}'
# max-cudagraph-capture-size: 8

max-model-len: 1048576
gpu-memory-utilization: 0.95
max-num-seqs: 16
max-num-batched-tokens: 16384

# Probably required.
# ValueError: Flashinfer allreduce is not supported for multi-node allreduce with 'trtllm' backend. Please use 'mnnvl' backend instead.
# requires patching:
# ivllm patch 0.30.0 patches/0.30.0/disable-flashinfer-unified.v0.30.0.v1.patch
env:
   IVLLM_DISABLE_FLASHINFER: 1
   VLLM_USE_BREAKABLE_CUDAGRAPH: 0

# Parsers
enable-auto-tool-choice: true
tool-call-parser: glm47
reasoning-parser: glm45

# Prefix caching
enable-prefix-caching: true

# Possibly required
# compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}}'
# no-async-scheduling: true
# disable-custom-all-reduce: true

