metadata:
    target: Isambard-AI GH200
    created-by: Rob
    version: 0.4.1
    lifecycle: experimental
min-vllm-version: "0.29.0"
idle-timeout: 60

# vLLM config for zai-org/GLM-5.3-Flash on Isambard AI
#
# - 320 GB model
#
# Model: ~743B total parameters, 39B active (MoE)
# Quantization: FP8 (1 byte/param)
#   Total weight footprint: ~743 GB
#
# KV Cache Offloading:
#   1M context requires significant KV cache

model: zai-org/GLM-5.3-Flash

# Total number of attention head (64) must be divisible by number of nodes.
tensor-parallel-size: 8
distributed-backend-executor: ray
enable-expert-parallel: true
no-enable-flash-autotune: true

max-model-len: 1048576
# Memory tuning (70 GB usable per GPU)
# 62 GB weights + 8 GB KV cache headroom
gpu-memory-utilization: 0.95
max-num-seqs: 16
max-num-batched-tokens: 16384

# Skip DeepGEMM warmup (faster startup)
env:
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 1800

# Parsers (GLM-5.2 custom)
enable-auto-tool-choice: true
tool-call-parser: glm47
reasoning-parser: glm45

# Prefix caching
enable-prefix-caching: true

# Multi-node compilation fix
compilation-config: '{"pass_config": {"fuse_allreduce_rms": false}}'
no-async-scheduling: true

